  <style>
  .lc-initial-loader{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fff;color:#0c347b;text-align:center;padding:28px}
  .lc-loader-mark{height:52px;width:52px;border:2px solid #d6e2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:4px;animation:lc-loader-breathe 1.4s ease-in-out infinite}
  .lc-loader-mark span{width:6px;height:6px;border-radius:50%;background:#0b3a98;animation:lc-loader-dot 1s ease-in-out infinite alternate}
  .lc-loader-mark span:nth-child(2){animation-delay:.18s}.lc-loader-mark span:nth-child(3){animation-delay:.36s}
  .lc-loader-name{font:700 14px/1.3 system-ui,sans-serif;letter-spacing:.2em;margin:3px 0 0}
  .lc-loader-sub{font:400 11px/1.5 system-ui,sans-serif;letter-spacing:.035em;color:#748197;margin:0}
  @keyframes lc-loader-breathe{50%{transform:scale(1.05);border-color:#a0bde9}}
  @keyframes lc-loader-dot{to{opacity:.35;transform:translateY(-4px)}}
  @media(prefers-reduced-motion:reduce){.lc-loader-mark,.lc-loader-mark span{animation:none}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app"><main class="loading lc-initial-loader" id="main" role="status" aria-label="Loading The Love Channels"><div class="lc-loader-mark" aria-hidden="true"><span></span><span></span><span></span></div><p class="lc-loader-name">THE LOVE CHANNELS</p><p class="lc-loader-sub">Rooted in love. Growing in faith.</p></main></div>
  <dialog id="modal" aria-labelledby="modal-title"><button class="icon-button modal-close" aria-label="Close dialog" data-close>×</button><div id="modal-body"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
